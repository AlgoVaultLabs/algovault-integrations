name: ci

run-name: algovault-integrations CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-node:
    name: node — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest (examples/ai4trade/)
        run: npm test

  test-python-nautilus:
    name: python — pytest (examples/nautilus_trader/)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/nautilus_trader/pyproject.toml

      - name: Install example with dev deps
        working-directory: examples/nautilus_trader
        run: pip install -e .[dev]

      - name: Run pytest
        working-directory: examples/nautilus_trader
        run: pytest tests/ -v

  test-python-hummingbot:
    name: python — pytest (examples/hummingbot/)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/hummingbot/pyproject.toml

      - name: Install example with dev deps
        working-directory: examples/hummingbot
        run: pip install -e .[dev]

      - name: Run pytest
        working-directory: examples/hummingbot
        run: pytest tests/ -v

  test-python-freqtrade:
    name: python — pytest (examples/freqtrade/)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/freqtrade/pyproject.toml

      - name: Install example with dev deps
        working-directory: examples/freqtrade
        run: pip install -e .[dev]

      - name: Run pytest
        working-directory: examples/freqtrade
        run: pytest tests/ -v
